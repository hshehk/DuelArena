# DuelArena 設定檔

settings:
  # 決鬥結束後,贏家可以整理(回收物品/方塊)的秒數
  cleanup-seconds: 60
  # 決鬥邀請的逾時秒數,超過沒回應自動取消
  invite-timeout-seconds: 30
  # 打刀場(BLADE)禁止放置/召喚的實體(EntityType 名稱,大寫)
  blade-banned-entities:
    - END_CRYSTAL
    - MINECART_TNT
  # 打刀場(BLADE)禁止放置的方塊(Material 名稱,大寫)
  blade-banned-blocks:
    - RESPAWN_ANCHOR

  # 決鬥中(含贏家整理期間)禁止使用的指令黑名單。
  # 不用加 /,不分大小寫;可以寫多個字的指令,例如 "tpa accept"。
  # 別名(例如 tp 與 teleport)要分別列出;"minecraft:tp" 這類前綴寫法會自動視為 tp。
  # 擁有 duelarena.admin.bypass 權限的人不受限制。
  blocked-commands:
    - tp
    - teleport
    - tphere
    - tppos
    - tpa
    - tpahere
    - tpaccept
    - tpyes
    - home
    - homes
    - spawn
    - warp
    - back
    - rtp
    - wild

  # 有安裝 PvPManager 時,還在新手保護中的玩家不能邀請/被邀請/接受決鬥。
  block-newbie-protected: true

# 場地資料已改存在 arenas.yml,請用 /duelarena 指令設定,不要手動編輯。
